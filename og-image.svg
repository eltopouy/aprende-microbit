<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171920"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5b731"/>
      <stop offset="100%" stop-color="#e09f3e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Technical Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Microbit Board Illustration -->
  <g transform="translate(740, 130)">
    <!-- PCB -->
    <rect x="0" y="0" width="380" height="300" rx="36" fill="#1e222b" stroke="#2e3442" stroke-width="4"/>
    <!-- Edge Connector -->
    <rect x="20" y="270" width="340" height="30" fill="url(#gold)" rx="4"/>
    <!-- 5 Large Ring Pads -->
    <circle cx="50" cy="285" r="12" fill="#0b0d11"/>
    <circle cx="120" cy="285" r="12" fill="#0b0d11"/>
    <circle cx="190" cy="285" r="12" fill="#0b0d11"/>
    <circle cx="260" cy="285" r="12" fill="#0b0d11"/>
    <circle cx="330" cy="285" r="12" fill="#0b0d11"/>
    
    <!-- Gold Logo Touch -->
    <path d="M 160 30 L 220 30 Q 230 42 220 54 L 160 54 Q 150 42 160 30 Z" fill="url(#gold)"/>
    
    <!-- Buttons A and B -->
    <circle cx="65" cy="150" r="22" fill="#333a48"/>
    <circle cx="65" cy="150" r="14" fill="#11141a"/>
    <text x="65" y="156" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">A</text>

    <circle cx="315" cy="150" r="22" fill="#333a48"/>
    <circle cx="315" cy="150" r="14" fill="#11141a"/>
    <text x="315" y="156" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">B</text>

    <!-- 5x5 LED Matrix Glow -->
    <g transform="translate(130, 85)">
      <!-- Heart Pattern in Glowing Red -->
      <!-- Row 0 -->
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#2d1518"/>
      <rect x="26" y="0" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="52" y="0" width="18" height="18" rx="3" fill="#2d1518"/>
      <rect x="78" y="0" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="104" y="0" width="18" height="18" rx="3" fill="#2d1518"/>
      <!-- Row 1 -->
      <rect x="0" y="26" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="26" y="26" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="52" y="26" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="78" y="26" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="104" y="26" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <!-- Row 2 -->
      <rect x="0" y="52" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="26" y="52" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="52" y="52" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="78" y="52" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="104" y="52" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <!-- Row 3 -->
      <rect x="0" y="78" width="18" height="18" rx="3" fill="#2d1518"/>
      <rect x="26" y="78" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="52" y="78" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="78" y="78" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="104" y="78" width="18" height="18" rx="3" fill="#2d1518"/>
      <!-- Row 4 -->
      <rect x="0" y="104" width="18" height="18" rx="3" fill="#2d1518"/>
      <rect x="26" y="104" width="18" height="18" rx="3" fill="#2d1518"/>
      <rect x="52" y="104" width="18" height="18" rx="3" fill="url(#red)" filter="drop-shadow(0 0 8px #ff3b30)"/>
      <rect x="78" y="104" width="18" height="18" rx="3" fill="#2d1518"/>
      <rect x="104" y="104" width="18" height="18" rx="3" fill="#2d1518"/>
    </g>
  </g>

  <!-- Typography Content (Left) -->
  <g transform="translate(90, 160)">
    <!-- Badge -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="rgba(245, 183, 49, 0.15)" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="95" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="13" fill="#f5b731" text-anchor="middle" letter-spacing="1">SIMULADOR 3D v2</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-1">
      Aprende Micro:bit
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="24" fill="#94a3b8">
      12 Lecciones Interactivas en Español
    </text>

    <!-- Features List -->
    <g transform="translate(0, 190)" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#cbd5e1">
      <text x="0" y="0">✓ MicroPython y MakeCode Blocks</text>
      <text x="0" y="34">✓ Sintetizador de audio real Web Audio API</text>
      <text x="0" y="68">✓ Sensores: Luz, Temperatura, Acelerómetro, Servos y Sonar</text>
    </g>

    <!-- Provider Credit -->
    <g transform="translate(0, 340)">
      <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#e2e8f0">
        Servicio TI Uruguay 
      </text>
      <text x="160" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#f5b731">
        · www.servicioti.com.uy
      </text>
    </g>
  </g>
</svg>
